      // Inline Lucide Rendering engine
      function Lucide({ name, className, size = 20, ...props }) {
        if (!window.lucide || !window.lucide.icons) {
          return <span className={className} style={{ width: size, height: size, display: 'inline-block' }} />;
        }

        // Standardize icon name lookup
        const kebabName = name.replace(/([A-Z])/g, "-$1").toLowerCase().replace(/^-/, "");
        const camelName = name.charAt(0).toUpperCase() + name.slice(1);
        
        let iconNode = window.lucide.icons[name] ||
                       window.lucide.icons[camelName] ||
                       window.lucide.icons[kebabName];
                       
        if (!iconNode) {
          const lowerName = name.toLowerCase();
          iconNode = window.lucide.icons[lowerName];
        }

        if (!iconNode) {
          iconNode = window.lucide.icons['Sword'] || window.lucide.icons['sword'];
        }

        if (!iconNode) {
          return <span className={className} style={{ width: size, height: size, display: 'inline-block' }} />;
        }

        // Render child path/circle/etc
        const renderChild = (child, index) => {
          if (!Array.isArray(child)) return null;
          const [tag, attrs, children] = child;
          
          const reactAttrs = {};
          if (attrs) {
            Object.keys(attrs).forEach(key => {
              let reactKey = key;
              if (key === 'class') {
                reactAttrs['className'] = attrs[key];
              } else if (key.includes('-')) {
                reactKey = key.replace(/-([a-z])/g, (g) => g[1].toUpperCase());
                reactAttrs[reactKey] = attrs[key];
              } else {
                reactAttrs[reactKey] = attrs[key];
              }
            });
          }
          reactAttrs.key = index;

          return React.createElement(
            tag,
            reactAttrs,
            Array.isArray(children) ? children.map((c, i) => renderChild(c, i)) : null
          );
        };

        let svgAttrs = {
          xmlns: "http://www.w3.org/2000/svg",
          width: size,
          height: size,
          viewBox: "0 0 24 24",
          fill: "none",
          stroke: "currentColor",
          strokeWidth: "2",
          strokeLinecap: "round",
          strokeLinejoin: "round",
          className: className,
          ...props
        };

        let childrenToRender = [];

        if (Array.isArray(iconNode)) {
          if (typeof iconNode[0] === 'string' && iconNode[0] === 'svg') {
            const nodeAttrs = iconNode[1] || {};
            childrenToRender = iconNode[2] || [];
            const mergedAttrs = {};
            Object.keys(nodeAttrs).forEach(key => {
              let reactKey = key;
              if (key === 'class') reactKey = 'className';
              else if (key.includes('-')) {
                reactKey = key.replace(/-([a-z])/g, (g) => g[1].toUpperCase());
              }
              mergedAttrs[reactKey] = nodeAttrs[key];
            });
            svgAttrs = { ...svgAttrs, ...mergedAttrs, className: className, width: size, height: size, ...props };
          } else {
            childrenToRender = iconNode;
          }
        }

        return React.createElement(
          "svg",
          svgAttrs,
          childrenToRender.map((child, i) => renderChild(child, i))
        );
      }

      // -------------------------------------------------------------
      // Component: CameraModal
      // -------------------------------------------------------------
      function CameraModal({ isOpen, onClose, habitId, habitName, onSuccess }) {
        const [streamActive, setStreamActive] = useState(false);
        const [capturing, setCapturing] = useState(false);
        const [verifying, setVerifying] = useState(false);
        const [errorText, setErrorText] = useState(null);
        const [aiResult, setAiResult] = useState(null);

        const videoRef = useRef(null);
        const canvasRef = useRef(null);
        const streamRef = useRef(null);

        useEffect(() => {
          if (isOpen) {
            startCamera();
          } else {
            stopCamera();
            setAiResult(null);
            setErrorText(null);
          }
          return () => stopCamera();
        }, [isOpen]);

        async function startCamera() {
          setErrorText(null);
          try {
            if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
              const stream = await navigator.mediaDevices.getUserMedia({
                video: { facingMode: "user" },
                audio: false
              });
              streamRef.current = stream;
              if (videoRef.current) {
                videoRef.current.srcObject = stream;
                videoRef.current.play();
              }
              setStreamActive(true);
            } else {
              throw new Error("No camera media devices found on this system.");
            }
          } catch (err) {
            console.warn("Camera hardware activation failed, fallback enabled:", err);
            setErrorText("Camera hardware not available. Simulating medieval scouting mirror (Virtual Stream)...");
            setStreamActive(false);
          }
        }

        function stopCamera() {
          if (streamRef.current) {
            streamRef.current.getTracks().forEach((track) => track.stop());
            streamRef.current = null;
          }
          setStreamActive(false);
        }

        async function handleCapture() {
          setCapturing(true);
          setVerifying(true);
          setErrorText(null);

          let base64Image = "";
          try {
            if (streamActive && videoRef.current && canvasRef.current) {
              const video = videoRef.current;
              const canvas = canvasRef.current;
              canvas.width = video.videoWidth || 640;
              canvas.height = video.videoHeight || 480;
              const ctx = canvas.getContext("2d");
              if (ctx) {
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                base64Image = canvas.toDataURL("image/jpeg");
              }
            } else {
              base64Image = getPlaceholderBase64();
            }

            stopCamera();

            const response = await fetch("/api/verify-habit", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ habitId, image: base64Image, habitName })
            });

            const data = await response.json();
            if (data.success) {
              setAiResult({
                verified: data.verified,
                analysis: data.analysis,
                score: data.workScore
              });
            } else {
              throw new Error(data.error || "Mysterious shadow magic blocked verification.");
            }
          } catch (err) {
            console.error("AI verify exception:", err);
            setAiResult({
              verified: true,
              analysis: "The training masters are distracted by combat (API offline)! Your oath of truth is accepted. Victory recorded!",
              score: 100
            });
          } finally {
            setCapturing(false);
            setVerifying(false);
          }
        }

        function handleClaimReward() {
          if (aiResult) {
            onSuccess(aiResult.verified, aiResult.analysis, aiResult.score);
          }
          onClose();
        }

        function getPlaceholderBase64() {
          const tempCanvas = document.createElement("canvas");
          tempCanvas.width = 300;
          tempCanvas.height = 300;
          const ctx = tempCanvas.getContext("2d");
          if (ctx) {
            ctx.fillStyle = "#310B0B";
            ctx.fillRect(0, 0, 300, 300);
            ctx.fillStyle = "#EEB76B";
            ctx.font = "14px serif";
            ctx.textAlign = "center";
            ctx.fillText(`OverStressed Quest Capture Mirror`, 150, 100);
            ctx.fillText(`Quest: ${habitName}`, 150, 150);
            ctx.fillText(`Status: Verified Active Effort`, 150, 200);

          return tempCanvas.toDataURL("image/jpeg");

              statGlow: "border-rose-500/40 shadow-[0_0_25px_rgba(244,63,94,0.3)]"

      function Arena({ profile, onQuestVerified, onSkipLevel }) {
        const [activeCameraQuest, setActiveCameraQuest] = useState(null);
        const [countdownStr, setCountdownStr] = useState("12:00:00");
        const [toastText, setToastText] = useState(null);

          "“Even the Lord of the Reaper began with a single written verse.”",
          "“The strongest sword is forged under the heat of consistency.”",
          "“He who conquers their morning conquers the realm!”"

        const [quote, setQuote] = useState(RPG_QUOTES[0]);

        useEffect(() => {
          const rand = RPG_QUOTES[Math.floor(Math.random() * RPG_QUOTES.length)];
          setQuote(rand);

          const interval = setInterval(() => {
            const now = new Date();
            const midnight = new Date();
            midnight.setHours(24, 0, 0, 0);
            const diff = midnight.getTime() - now.getTime();
            
            const hours = Math.floor(diff / (1000 * 60 * 60));
            const mins = Math.floor((diff / (1000 * 60)) % 60);
            const secs = Math.floor((diff / 1000) % 60);

            setCountdownStr(`${hours.toString().padStart(2, "0")}:${mins.toString().padStart(2, "0")}:${secs.toString().padStart(2, "0")}`);

          return () => clearInterval(interval);
        }, []);

        function triggerToast(text) {
          setToastText(text);
          setTimeout(() => setToastText(null), 4000);
        }

        const arTheme = getArenaLevelStyles(profile.level);
        const todayStr = new Date().toISOString().split("T")[0];
        const habit1Completed = profile.habit1_lastCompleted === todayStr;
        const habit2Completed = profile.habit2_lastCompleted === todayStr;
        const habit3Completed = profile.habit3_lastCompleted === todayStr;

        const completedCount = [habit1Completed, habit2Completed, habit3Completed].filter(Boolean).length;
        const maxHP = 100;
        const currentBossHP = Math.max(0, maxHP - (completedCount * 33.3));

        let enemyName = "Lazy Sloth (Level 1)";
        let enemyVisualId = 1;
        let statusPenaltyText = "";

        if (profile.xp > 500 && profile.xp <= 1500) {
          enemyName = "Energy Thief (Level 2)";
          enemyVisualId = 2;
        } else if (profile.xp > 1500) {
          enemyName = "Impending Doom (Level 3)";
          enemyVisualId = 3;
        }

        const yesterday = new Date();
        yesterday.setDate(yesterday.getDate() - 1);
        const yStr = yesterday.toISOString().split("T")[0];

        const missedYesterday = 
          profile.lastCheckedDate !== todayStr &&
          ((profile.habit1_lastCompleted !== yStr && profile.habit1_lastCompleted !== todayStr) ||
           (profile.habit2_lastCompleted !== yStr && profile.habit2_lastCompleted !== todayStr) ||
           (profile.habit3_lastCompleted !== yStr && profile.habit3_lastCompleted !== todayStr));

        if (missedYesterday) {
          if (enemyVisualId === 1) {
            statusPenaltyText = "The Lazy Sloth froze your training fields! Focus state frozen.";
          } else if (enemyVisualId === 2) {
            statusPenaltyText = "The Energy Thief sneaked in and depleted -5 Experience from your character record!";
          } else {
            statusPenaltyText = "Impending Doom has drained -1 of your Armory Coins! Restore loyalty bounds immediately!";
          }
        }

        function handleCameraVerifySuccess(verified, analysis) {
          if (!verified) {
            triggerToast("AI Taskmaster: Effort not fully registered. Try again with a clear view!");
            return;
          }

          if (!activeCameraQuest) return;

          let xpAward = 5;
          let starsAward = 0;
          const baseMultiplier = (profile.habit1_streak > 0 || profile.habit2_streak > 0 || profile.habit3_streak > 0) ? 2 : 1;

          if (activeCameraQuest === "habit1") {
            xpAward = 5 * baseMultiplier;
            if ((profile.habit1_streak + 1) % 7 === 0) starsAward = 3;
          } else if (activeCameraQuest === "habit2") {
            xpAward = 10 * baseMultiplier;
            if ((profile.habit2_streak + 1) % 3 === 0) starsAward = 6;
          } else {
            xpAward = 15 * baseMultiplier;
            starsAward = 9;
          }

          onQuestVerified(activeCameraQuest, xpAward, starsAward, analysis);
          triggerToast(`Victory! Claimed +${xpAward} XP and ⭐ ${starsAward} Coins!`);

                  <rect x="14" y="18" width="4" height="4" fill="#b0b5b8" />

        return (
          <div className="space-y-6">
            {toastText && (
              <div className="fixed top-24 left-1/2 -translate-x-1/2 bg-[#EEB76B] border-2 border-[#E2703A] text-[#310B0B] px-5 py-3 rounded-full font-mono text-xs uppercase tracking-wide z-50 text-center shadow-lg">

            {missedYesterday && statusPenaltyText && (
              <div className="bg-[#9c3d54] border-2 border-[#ffdad7] text-white p-4 rounded-[22px] flex items-center gap-3 relative overflow-hidden">
                <Lucide name="ShieldAlert" className="w-6 h-6 text-[#ffdad7] shrink-0 animate-bounce" />
                <div>

                    {statusPenaltyText}

            {/* Main Battle Arena Card */}
            <section className={`border-2 rounded-[22px] p-6 relative overflow-hidden flex flex-col md:flex-row items-center justify-between gap-6 transition-all duration-300 ${arTheme.arenaBg} ${arTheme.arenaBorder} ${arTheme.arenaShadow}`}>
              <div className="absolute inset-x-0 bottom-0 h-10 bg-[#310B0B]/40 blur-sm pointer-events-none" />
              
              <div className="flex-1 text-center flex flex-col items-center">

                  Lv. {profile.level} Warrior

                <div className={`w-40 h-48 rounded-xl flex items-center justify-center p-2 transition-all duration-300 ${arTheme.avatarBg}`}>
                  {renderProtagonistSVG()}
                </div>
                <h4 className={`font-bold text-lg mt-3 truncate max-w-[150px] transition-all duration-300 ${arTheme.glowText}`}>
                  {profile.displayName}

              <div className="flex flex-col items-center justify-center text-center px-4 self-center">
                <div className="w-12 h-12 bg-[#310B0B] border-2 border-[#EEB76B]/40 rounded-full flex items-center justify-center text-[#E2703A] font-extrabold text-sm relative z-10 scale-90">

              <div className="flex-1 text-center flex flex-col items-center">

                  {renderAntagonistSVG()}

            </section>

            {/* Boss HP block */}
            <section className={`bg-[#310B0B] border-2 ${arTheme.questCardBorder} rounded-[22px] p-4 transition-all duration-300`} id="boss-hp-section">
              <div className="flex justify-between items-center mb-2">

      // -------------------------------------------------------------

      // -------------------------------------------------------------
      function App() {
        const [activeTab, setActiveTab] = useState("home");
        const [loading, setLoading] = useState(true);
        const [theme, setTheme] = useState("dark");
        const [currentUser, setCurrentUser] = useState(null);
        const [profile, setProfile] = useState(null);
        const [logs, setLogs] = useState([]);
        const [activeLevelUp, setActiveLevelUp] = useState(null);
        const [showPerfectDayOverlay, setShowPerfectDayOverlay] = useState(false);

        const sdk = getSDK();

        // Level Up Threshold Calculations
        function calcEvolvedLevel(xpVal) {
          if (xpVal >= 3501) return 5;
          if (xpVal >= 2001) return 4;
          if (xpVal >= 1001) return 3;
          if (xpVal >= 501) return 2;
          return 1;
        }

        // Initialize Firebase authentication stream state
        useEffect(() => {
          if (!sdk.auth) {
            setLoading(false);
            return;
          }
          const unsubscribe = sdk.onAuthStateChanged(sdk.auth, async (user) => {
            setLoading(true);
            if (user) {
              setCurrentUser(user);
              await syncUserProfile(user.uid, user.email || "", user.displayName || "Hero");
            } else {
              setCurrentUser(null);
              // Fallback to offline Sandboxing profile
              await syncUserProfile("guest-uid", "guest@overstressed.domain", "Galahad the Brave");
            }
          });
          return () => unsubscribe();
        }, []);

        async function syncUserProfile(uid, email, displayName) {
          try {
            if (uid === "guest-uid") {
              const localProf = localStorage.getItem("overstressed_profile");
              const localLogs = localStorage.getItem("overstressed_logs");

              if (localProf) {
                setProfile(JSON.parse(localProf));
              } else {
                const initP = INITIAL_PROFILE(uid, email, displayName);
                setProfile(initP);
                localStorage.setItem("overstressed_profile", JSON.stringify(initP));
              }

              if (localLogs) {
                setLogs(JSON.parse(localLogs));
              } else {
                setLogs([]);
                localStorage.setItem("overstressed_logs", JSON.stringify([]));
              }
            } else {
              const uDocRef = sdk.doc(sdk.db, "users", uid);
              const uDocSnap = await sdk.getDoc(uDocRef);
              let activeProfile;

              if (uDocSnap.exists()) {
                activeProfile = uDocSnap.data();
              } else {
                activeProfile = INITIAL_PROFILE(uid, email, displayName);
                await sdk.setDoc(uDocRef, activeProfile);
              }

              const logsColRef = sdk.collection(sdk.db, "users", uid, "logs");
              const logsSnap = await sdk.getDocs(logsColRef);
              const loadedLogs = [];
              logsSnap.forEach((docSnap) => {
                loadedLogs.push(docSnap.data());
              });

              // Reconcile Yesterday
              const reconciledProfile = resolveDailyAmbushCheck(activeProfile);
              if (reconciledProfile.lastCheckedDate !== activeProfile.lastCheckedDate || reconciledProfile.xp !== activeProfile.xp) {
                await sdk.updateDoc(uDocRef, { ...reconciledProfile });
              }

              setProfile(reconciledProfile);
              setLogs(loadedLogs);
            }
          } catch (err) {
            console.error("Critical Profile Fetch Failure:", err);
            setProfile(INITIAL_PROFILE(uid, email, displayName));
          } finally {
            setLoading(false);
          }
        }

        function resolveDailyAmbushCheck(prof) {
          const todayStr = new Date().toISOString().split("T")[0];
          if (prof.lastCheckedDate === todayStr) return prof;

          const yesterday = new Date();
          yesterday.setDate(yesterday.getDate() - 1);
          const yesterdayStr = yesterday.toISOString().split("T")[0];

          const missed1 = prof.habit1_lastCompleted !== yesterdayStr && prof.habit1_lastCompleted !== todayStr;
          const missed2 = prof.habit2_lastCompleted !== yesterdayStr && prof.habit2_lastCompleted !== todayStr;
          const missed3 = prof.habit3_lastCompleted !== yesterdayStr && prof.habit3_lastCompleted !== todayStr;

          const missedCount = [missed1, missed2, missed3].filter(Boolean).length;
          let xpPenalty = 0;
          let starPenalty = 0;

          if (missedCount > 0) {
            if (prof.xp <= 500) {} 
            else if (prof.xp > 500 && prof.xp <= 1500) xpPenalty = 5;
            else starPenalty = 1;
          }

          return {
            ...prof,
            xp: Math.max(0, prof.xp - xpPenalty),
            stars: Math.max(0, prof.stars - starPenalty),
            lastCheckedDate: todayStr,
            habit1_streak: missed1 ? 0 : prof.habit1_streak,
            habit2_streak: missed2 ? 0 : prof.habit2_streak,
            habit3_streak: missed3 ? 0 : prof.habit3_streak
          };
        }

        // Bulletproof web sign-in trigger
        async function handleLogin() {
          if (!sdk.auth) return;
          try {
            await sdk.signInWithPopup(sdk.auth, sdk.googleProvider);
          } catch (err) {
            console.error("Login popup cancelled or blocked:", err);
          }
        }

        async function handleLogout() {
          try {
            await sdk.signOut(sdk.auth);
            setCurrentUser(null);
            setProfile(null);
            setLogs([]);
          } catch (err) {
            console.error("Logout issue:", err);
          }
        }

        async function handleSkipLevel() {
          if (!profile) return;
          const currentLvl = profile.level;
          const nextLvl = currentLvl + 1;
          let targetXP = profile.xp;

          if (nextLvl === 2) targetXP = 501;
          else if (nextLvl === 3) targetXP = 1001;
          else if (nextLvl === 4) targetXP = 2001;
          else if (nextLvl === 5) targetXP = 3501;
          else targetXP = Math.max(3501, profile.xp) + 1500;

          const updated = { ...profile, level: nextLvl, xp: targetXP };
          setProfile(updated);
          setActiveLevelUp(nextLvl);

          if (profile.userId === "guest-uid") {
            localStorage.setItem("overstressed_profile", JSON.stringify(updated));
          } else {
            await sdk.updateDoc(sdk.doc(sdk.db, "users", profile.userId), { ...updated });
          }
        }

        async function handleQuestVerified(habitId, xpGained, starsGained, analysis) {
          if (!profile) return;
          const todayStr = new Date().toISOString().split("T")[0];
          const updated = { ...profile };
          let streakValue = 0;

          if (habitId === "habit1") {
            updated.habit1_lastCompleted = todayStr;
            updated.habit1_streak = (updated.habit1_streak || 0) + 1;
            streakValue = updated.habit1_streak;
          } else if (habitId === "habit2") {
            updated.habit2_lastCompleted = todayStr;
            updated.habit2_streak = (updated.habit2_streak || 0) + 1;
            streakValue = updated.habit2_streak;
          } else {
            updated.habit3_lastCompleted = todayStr;
            updated.habit3_streak = (updated.habit3_streak || 0) + 1;
            streakValue = updated.habit3_streak;
          }

          updated.xp += xpGained;
          updated.stars += starsGained;

          if (streakValue > updated.bestStreak) {
            updated.bestStreak = streakValue;
          }

          const newLvl = calcEvolvedLevel(updated.xp);
          if (newLvl > updated.level) {
            updated.level = newLvl;
            setActiveLevelUp(newLvl);
          }

          const logId = `log-${Date.now()}`;
          const newLog = {
            logId,
            userId: profile.userId,
            habitId,
            completedDate: todayStr,
            timestamp: new Date().toISOString(),
            xpGained,
            starsGained
          };

          const isHabit1Done = updated.habit1_lastCompleted === todayStr;
          const isHabit2Done = updated.habit2_lastCompleted === todayStr;
          const isHabit3Done = updated.habit3_lastCompleted === todayStr;

          if (isHabit1Done && isHabit2Done && isHabit3Done) {
            const logsToday = logs.filter(l => l.completedDate === todayStr);
            if (logsToday.length === 2) {
              updated.stars += 50;
              updated.perfectDays += 1;
              setShowPerfectDayOverlay(true);
            }
          }

          const updatedLogs = [newLog, ...logs];
          setLogs(updatedLogs);
          setProfile(updated);

          if (profile.userId === "guest-uid") {
            localStorage.setItem("overstressed_profile", JSON.stringify(updated));
            localStorage.setItem("overstressed_logs", JSON.stringify(updatedLogs));
          } else {
            await sdk.updateDoc(sdk.doc(sdk.db, "users", profile.userId), { ...updated });
            await sdk.setDoc(sdk.doc(sdk.db, "users", profile.userId, "logs", logId), newLog);
          }
        }

        async function handlePurchaseItem(item) {
          if (!profile) return;
          const updated = {
            ...profile,
            stars: profile.stars - item.cost,
            accessories: [...profile.accessories, item.id],
            equipped: [...(profile.equipped || []), item.id]
          };

          if (item.id === "tome") {
            updated.xp += 500;
            const newLvl = calcEvolvedLevel(updated.xp);
            if (newLvl > updated.level) {
              updated.level = newLvl;
              setActiveLevelUp(newLvl);
            }
          }

          setProfile(updated);

          if (profile.userId === "guest-uid") {
            localStorage.setItem("overstressed_profile", JSON.stringify(updated));
          } else {
            await sdk.updateDoc(sdk.doc(sdk.db, "users", profile.userId), { ...updated });
          }
        }

        async function handleEquipItem(itemId, equip) {
          if (!profile) return;
          let updatedEquipped = [...(profile.equipped || [])];
          if (equip) {
            if (!updatedEquipped.includes(itemId)) updatedEquipped.push(itemId);
          } else {
            updatedEquipped = updatedEquipped.filter(id => id !== itemId);
          }

          const updated = { ...profile, equipped: updatedEquipped };
          setProfile(updated);

          if (profile.userId === "guest-uid") {
            localStorage.setItem("overstressed_profile", JSON.stringify(updated));
          } else {
            await sdk.updateDoc(sdk.doc(sdk.db, "users", profile.userId), { ...updated });
          }
        }

        async function handleMasterPurge() {
          if (!profile) return;
          const blank = INITIAL_PROFILE(profile.userId, profile.email, profile.displayName);
          setProfile(blank);
          setLogs([]);

          if (profile.userId === "guest-uid") {
            localStorage.setItem("overstressed_profile", JSON.stringify(blank));
            localStorage.setItem("overstressed_logs", JSON.stringify([]));
          } else {
            await sdk.updateDoc(sdk.doc(sdk.db, "users", profile.userId), { ...blank });
            const logsColRef = sdk.collection(sdk.db, "users", profile.userId, "logs");
            const snap = await sdk.getDocs(logsColRef);
            for (const logDoc of snap.docs) {
              await sdk.deleteDoc(sdk.doc(sdk.db, "users", profile.userId, "logs", logDoc.id));
            }
          }
        }

        if (loading) {
          return (
            <div className="min-h-screen bg-[#310B0B] text-[#EEB76B] flex flex-col items-center justify-center p-4">
              <Lucide name="Sparkles" className="w-12 h-12 text-[#EEB76B] animate-spin mb-4" />
              <h2 className="font-bold text-xl uppercase tracking-wider">
                Entering OverStressed...
              </h2>
              <p className="font-mono text-[10px] text-[#ffdad7]/60 mt-1 uppercase">
                Verifying Quest Book and Guild Seals
              </p>
            </div>
          );
        }

        // Authenticated Gate Screen (Google Login)
        if (!currentUser && currentUser !== "guest-active") {
          return (
            <div className="min-h-screen bg-[#1c0404] text-[#EEB76B] flex flex-col items-center justify-center p-6 relative overflow-hidden">
              <div className="absolute inset-x-0 bottom-0 top-1/2 bg-[#310B0B]/40 blur-3xl pointer-events-none" />
              
              <div className="w-full max-w-sm bg-[#2b0707] border-4 border-[#EEB76B] rounded-[22px] p-8 text-center relative z-10" style={{ boxShadow: "0 10px 0 0 #3b1212" }}>
                <div className="absolute top-0 left-0 w-3 h-3 bg-[#EEB76B] polygon-diamond"></div>
                <div className="absolute top-0 right-0 w-3 h-3 bg-[#EEB76B] polygon-diamond"></div>
                <div className="absolute bottom-0 left-0 w-3 h-3 bg-[#EEB76B] polygon-diamond"></div>
                <div className="absolute bottom-0 right-0 w-3 h-3 bg-[#EEB76B] polygon-diamond"></div>

                <div className="w-20 h-20 bg-[#310B0B] border-2 border-[#EEB76B] rounded-full flex items-center justify-center mx-auto mb-4 text-[#EEB76B]">
                  <Lucide name="Trophy" className="w-10 h-10 animate-bounce" />
                </div>

                <h1 className="font-bold text-3xl text-[#EEB76B] tracking-wider uppercase mb-1">
                  OverStressed
                </h1>
                <p className="font-mono text-[#d4c4b3] text-xs uppercase tracking-widest mb-6">
                  Gamified Skill Habit Tracker
                </p>

                <p className="font-mono text-xs text-[#ffd6a2] leading-relaxed mb-8">
                  An Action-RPG campaign where your daily routines power your warrior, slay lazy habits, and barter epic weapons inside the Armory.
                </p>

                <div className="flex flex-col gap-3">
                  <button
                    onClick={handleLogin}
                    className="w-full bg-[#E2703A] hover:bg-[#EEB76B] text-[#ffd6a2] font-bold py-4 rounded-xl border-b-4 border-[#943700] text-sm uppercase transition-all duration-100 active:translate-y-1 active:border-b-0 cursor-pointer"
                  >
                    Step Inside (Google Sign In)
                  </button>
                  <button
                    onClick={() => {
                      setCurrentUser("guest-active");
                      syncUserProfile("guest-uid", "guest@overstressed.domain", "Galahad the Brave");
                    }}
                    className="w-full bg-transparent border border-[#EEB76B] text-[#EEB76B] hover:bg-[#310B0B] font-bold py-2.5 rounded-xl text-xs uppercase transition-all duration-100 cursor-pointer"
                  >
                    Enter as Guest (No Cloud Lock)
                  </button>
                </div>
              </div>
            </div>
          );
        }

        const xpBounds = profile ? (
          profile.xp <= 500 ? { min: 0, max: 500 } :
          profile.xp <= 1000 ? { min: 501, max: 1000 } :
          profile.xp <= 2000 ? { min: 1001, max: 2000 } :
          profile.xp <= 3500 ? { min: 2001, max: 3500 } : { min: 3501, max: 5000 }
        ) : { min: 0, max: 500 };

        const xpProgressPercent = profile ? Math.min(100, ((profile.xp - xpBounds.min) / (xpBounds.max - xpBounds.min)) * 100) : 0;

        return (
          <div className={`min-h-screen ${theme === "light" ? "bg-[#eae2cf] text-[#4f311c]" : "bg-[#1c0404] text-[#ffdad7]"} transition-colors duration-300`}>
            <div className="max-w-md mx-auto min-h-screen flex flex-col justify-between relative shadow-2xl bg-[#310B0B] border-x-4 border-[#EEB76B] outline-none">
              
              {/* Header */}
              <header className="bg-[#240304] border-b-4 border-[#E2703A] p-4 text-[#ffdad7] sticky top-0 z-40">
                <div className="flex justify-between items-center mb-3">
                  <div className="flex items-center gap-3">
                    <div className="w-10 h-10 bg-[#310B0B] border-2 border-[#EEB76B] rounded-full flex items-center justify-center font-bold text-lg text-[#EEB76B] font-extrabold shadow-inner relative">
                      {profile?.level || 1}
                    </div>
                    <div>
                      <h1 className="font-bold text-base text-[#EEB76B] tracking-wider uppercase leading-none">
                        OverStressed
                      </h1>
                      <p className="font-mono text-[9px] text-[#ffb4ab] mt-1.5 leading-none uppercase">
                        Level {profile?.level || 1} Warrior
                      </p>
                    </div>
                  </div>

                  <div className="flex items-center gap-3">
                    <div className="bg-[#310B0B] border border-[#EEB76B]/40 py-1 px-2.5 rounded-full flex items-center gap-1.5 font-bold text-xs text-[#EEB76B]">
                      <span>⭐</span>
                      <span>{profile?.stars || 0}</span>
                    </div>

                    {currentUser !== "guest-active" && (
                      <button onClick={handleLogout} className="p-2 bg-red-950 hover:bg-red-900 border border-red-500 rounded-lg cursor-pointer text-red-100 flex items-center justify-center">
                        <Lucide name="LogOut" className="w-3.5 h-3.5" />
                      </button>
                    )}
                    {currentUser === "guest-active" && (
                      <button onClick={() => {
                        setCurrentUser(null);
                        setProfile(null);
                        setLogs([]);
                      }} className="p-2 bg-red-950 hover:bg-red-900 border border-red-500 rounded-lg cursor-pointer text-red-200 text-xs font-mono uppercase">
                        Log In
                      </button>
                    )}
                  </div>
                </div>

                <div className="space-y-1">
                  <div className="flex justify-between items-center font-mono text-[9px] text-[#ffb4ab] uppercase">
                    <span>Experience Pool</span>
                    <span>{profile?.xp || 0} / {xpBounds.max} XP</span>
                  </div>
                  <div className="h-3 bg-[#170102] rounded-full overflow-hidden border border-[#504538] p-0.5">
                    <div className="h-full rounded-full transition-all duration-300 xp-block" style={{ width: `${xpProgressPercent}%` }} />
                  </div>
                </div>
              </header>

              {/* Scroll Content container */}
              <main className="flex-grow p-4 pb-24 overflow-y-auto" style={{ scrollbarWidth: "thin" }}>
                {activeTab === "home" && profile && (
                  <Arena profile={profile} onQuestVerified={handleQuestVerified} onSkipLevel={handleSkipLevel} />
                )}
                {activeTab === "stats" && profile && (
                  <Stats profile={profile} logs={logs} onNavigate={setActiveTab} />
                )}
                {activeTab === "shop" && profile && (
                  <Shop profile={profile} onPurchase={handlePurchaseItem} onEquip={handleEquipItem} />
                )}
                {activeTab === "settings" && profile && (
                  <Settings profile={profile} theme={theme} onToggleTheme={() => setTheme(theme === "dark" ? "light" : "dark")} onClearData={handleMasterPurge} />
                )}
              </main>

              {/* Nav */}
              <footer className="fixed bottom-0 max-w-md w-full bg-[#240304] border-t-4 border-[#E2703A] grid grid-cols-4 p-2 pb-5 z-40 text-center">
                <button onClick={() => setActiveTab("home")} className={`flex flex-col items-center justify-center p-2 h-[50px] cursor-pointer rounded-xl transition-all duration-100 ${activeTab === "home" ? "text-[#EEB76B] bg-[#310B0B] border border-[#EEB76B]/40" : "text-[#ffd6a2]/60 hover:text-white"}`}>
                  <Lucide name="Sword" className="w-5 h-5 mb-0.5" />
                  <span className="text-[10px] tracking-wider uppercase font-semibold">Arena</span>
                </button>
                <button onClick={() => setActiveTab("stats")} className={`flex flex-col items-center justify-center p-2 h-[50px] cursor-pointer rounded-xl transition-all duration-100 ${activeTab === "stats" ? "text-[#EEB76B] bg-[#310B0B] border border-[#EEB76B]/40" : "text-[#ffd6a2]/60 hover:text-white"}`}>
                  <Lucide name="BarChart2" className="w-5 h-5 mb-0.5" />
                  <span className="text-[10px] tracking-wider uppercase font-semibold">Logs</span>
                </button>
                <button onClick={() => setActiveTab("shop")} className={`flex flex-col items-center justify-center p-2 h-[50px] cursor-pointer rounded-xl transition-all duration-100 ${activeTab === "shop" ? "text-[#EEB76B] bg-[#310B0B] border border-[#EEB76B]/40" : "text-[#ffd6a2]/60 hover:text-white"}`}>
                  <Lucide name="ShoppingBag" className="w-5 h-5 mb-0.5" />
                  <span className="text-[10px] tracking-wider uppercase font-semibold">Shop</span>
                </button>
                <button onClick={() => setActiveTab("settings")} className={`flex flex-col items-center justify-center p-2 h-[50px] cursor-pointer rounded-xl transition-all duration-100 ${activeTab === "settings" ? "text-[#EEB76B] bg-[#310B0B] border border-[#EEB76B]/40" : "text-[#ffd6a2]/60 hover:text-white"}`}>
                  <Lucide name="Settings" className="w-5 h-5 mb-0.5" />
                  <span className="text-[10px] tracking-wider uppercase font-semibold">Codex</span>
                </button>
              </footer>

              {/* Majestic Evolved level Overlay */}
              {activeLevelUp && (
                <div className="fixed inset-0 bg-black/90 flex items-center justify-center p-4 z-50">
                  <div className="w-full max-w-sm bg-[#3b1212] border-4 border-[#ffb596] rounded-[22px] p-6 text-center text-[#ffdad7] relative overflow-hidden">
                    <Lucide name="Sparkles" className="w-16 h-16 text-[#ffd6a2] animate-spin mx-auto mb-4" />
                    <h3 className="font-extrabold text-[#ffd6a2] text-2xl uppercase tracking-wider mb-2">
                      WARRIOR EVOLVED!
                    </h3>
                    <p className="font-mono text-[#EEB76B] text-sm uppercase font-bold mb-4">
                      REACHED LEVEL {activeLevelUp}!
                    </p>
                    <p className="font-mono text-xs text-[#d4c4b3] leading-relaxed mb-6">
                      {activeLevelUp === 2 && "Unlocks Scribe Skills! A leather book now floats in your left hand, boosting cognitive stance stats!"}
                      {activeLevelUp === 3 && "Unlocks Athletic Weaponry! You wield a mystical sports racket, granting you continuous Armory coins."}
                      {activeLevelUp === 4 && "Gold Armored Shell! High-grade plate armor covers your body with levitating secondary broadswords!"}
                      {activeLevelUp === 5 && "Angelic Ascendancy! Guardian seraphim wings grow on your back, crowning your name across the kingdom!"}
                    </p>
                    <button onClick={() => setActiveLevelUp(null)} className="w-full bg-[#E2703A] hover:bg-[#EEB76B] text-[#ffd6a2] font-bold py-3.5 rounded-xl border-b-4 border-[#943700] text-xs uppercase cursor-pointer">
                      Continue Journey
                    </button>
                  </div>
                </div>
              )}

              {/* Double completion perfected day overlay */}
              {showPerfectDayOverlay && (
                <div className="fixed inset-0 bg-black/90 flex items-center justify-center p-4 z-50">
                  <div className="w-full max-w-sm bg-[#1c0f20] border-4 border-[#f2a8ff] rounded-[22px] p-6 text-center text-[#fbd5ff] relative overflow-hidden">
                    <Lucide name="Star" className="w-16 h-16 text-[#fbd5ff] animate-pulse mx-auto mb-4" />
                    <h3 className="font-extrabold text-[#EEB76B] text-2xl uppercase tracking-wider mb-2">
                      QUEST PERFECTED!
                    </h3>
                    <p className="font-mono text-[#fbd5ff] text-sm uppercase font-bold mb-4">
                      All 3 Proclamations Sealed!
                    </p>
                    <p className="font-mono text-xs text-[#ebd8ff] leading-relaxed mb-6">
                      The gods of the Keep rejoice! Complete focus on easy, medium and hard tasks awards you:
                    </p>
                    <div className="p-3 bg-[#44234f] border border-[#f5b8ff]/20 rounded-xl mb-6">
                      <span className="font-extrabold text-[#EEB76B] text-sm">+50 Spendable Stars</span>
                    </div>
                    <button onClick={() => setShowPerfectDayOverlay(false)} className="w-full bg-[#E2703A] hover:bg-[#EEB76B] text-[#ffd6a2] font-bold py-3.5 rounded-xl border-b-4 border-[#943700] text-xs uppercase cursor-pointer">
                      Proclaim Victory
                    </button>
                  </div>
                </div>
              )}

            </div>
          </div>
        );
      }

      // Root render initializer
      const rootEl = document.getElementById("root");
      const root = ReactDOM.createRoot(rootEl);
      root.render(<App />);
    </script>
  </body>
</html>
